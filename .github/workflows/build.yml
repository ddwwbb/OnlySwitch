name: Build and Release macOS

on:
  push:
    branches:
      - main
      - only-switch-lite
    tags:
      - 'v*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Build and Release
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test Swift packages
        run: swift test --package-path Modules

      - name: Test app
        run: |
          xcodebuild -quiet \
            -project OnlySwitch.xcodeproj \
            -scheme OnlySwitch \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/OnlySwitchDerivedData" \
            -destination "platform=macOS" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build universal Release app
        run: |
          xcodebuild -quiet \
            -project OnlySwitch.xcodeproj \
            -scheme OnlySwitch \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/OnlySwitchDerivedData" \
            -destination "generic/platform=macOS" \
            -skipMacroValidation \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app (ZIP & DMG)
        run: |
          APP_PATH="$RUNNER_TEMP/OnlySwitchDerivedData/Build/Products/Release/OnlySwitch.app"
          ZIP_PATH="$RUNNER_TEMP/OnlySwitch-macOS-universal.zip"
          DMG_PATH="$RUNNER_TEMP/OnlySwitch-macOS-universal.dmg"
          CHECKSUM_PATH="$RUNNER_TEMP/checksums.txt"

          test -d "$APP_PATH"
          lipo "$APP_PATH/Contents/MacOS/OnlySwitch" -verify_arch arm64
          lipo "$APP_PATH/Contents/MacOS/OnlySwitch" -verify_arch x86_64

          # Package ZIP
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          # Package DMG
          hdiutil create -volname "OnlySwitch" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"

          # Generate SHA256 Checksums
          cd "$RUNNER_TEMP"
          shasum -a 256 "OnlySwitch-macOS-universal.zip" "OnlySwitch-macOS-universal.dmg" > "$CHECKSUM_PATH"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnlySwitch-macOS-universal
          path: |
            ${{ runner.temp }}/OnlySwitch-macOS-universal.zip
            ${{ runner.temp }}/OnlySwitch-macOS-universal.dmg
            ${{ runner.temp }}/checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/OnlySwitch-macOS-universal.zip
            ${{ runner.temp }}/OnlySwitch-macOS-universal.dmg
            ${{ runner.temp }}/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
